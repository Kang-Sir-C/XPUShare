apiVersion: v1
kind: ServiceAccount
metadata:
  name: xpushare-scheduler
  namespace: kube-system
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xpushare-scheduler
rules:
  - apiGroups:
      - ""
    resources:
      - "*"
    verbs: 
      - "*"
  - apiGroups:
      - apps
      - extensions
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - "storage.k8s.io"
    resources:
      - "*"
    verbs:
      - "*"
  - apiGroups:
      - "coordination.k8s.io"
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - update
  - apiGroups:
      - "events.k8s.io"
    resources:
      - "*"
    verbs:
      - "*"
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: xpushare-scheduler
subjects:
- kind: ServiceAccount
  name: xpushare-scheduler
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: xpushare-scheduler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scheduler-config
  namespace: kube-system
data:
  scheduler-config.yaml: |
    apiVersion: kubescheduler.config.k8s.io/v1alpha2
    kind: KubeSchedulerConfiguration
    leaderElection:
      leaderElect: false
    profiles:
      - schedulerName: xpushare-scheduler
        plugins:
          queueSort:
            enabled:
              - name: xpushare-scheduler
            disabled:
              - name: "*"
          preFilter:
            enabled:
              - name: xpushare-scheduler
          filter:
            enabled:
              - name: xpushare-scheduler
          score:
            enabled:
              - name: xpushare-scheduler
            disabled:
              - name: "*"
          reserve:
            enabled:
              - name: xpushare-scheduler
          unreserve:
            enabled:
              - name: xpushare-scheduler
          permit:
            enabled:
              - name: xpushare-scheduler
        pluginConfig:
          - name: xpushare-scheduler
            args:
              level: 3
              prometheusURL: "http://prometheus.icps-monitor.svc:9090"
              xpuShareConfig: "/xpushare-topology/xpushare-config.yaml"
---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: xpushare-scheduler
  namespace: kube-system
  annotations:
    scheduler.alpha.kubernetes.io/critical-pod: ""
  labels:
    app: xpushare-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xpushare-scheduler
  template:
    metadata:
      labels:
        app: xpushare-scheduler
    spec:
      serviceAccountName: xpushare-scheduler
      containers:
        - name: xpushare-scheduler
          image: xpushare-scheduler:0227-3
          imagePullPolicy: Never
          command: ["xpushare-scheduler"]
          args:
            - --config=/scheduler/scheduler-config.yaml
          env:
            # Must match collector's XPU_PROVIDER so the scheduler injects the
            # correct visible-devices env var name.
            - name: XPU_PROVIDER
              value: "iluvatar"
            # Optional: control whether the visible-devices env contains UUIDs or indices.
            # - iluvatar/mthreads default to "index"
            # - nvidia default to "uuid"
            # - name: XPU_VISIBLE_DEVICES_VALUE
            #   value: "index"
            # Optional: override visible-devices env var name (takes precedence).
            # Supports comma-separated names, e.g.:
            #   "MTHREADS_VISIBLE_DEVICES,MUSA_VISIBLE_DEVICES"
            # - name: XPU_VISIBLE_DEVICES_ENV
            #   value: "IX_VISIBLE_DEVICES"
            # Optional: choose hook library injected via LD_PRELOAD.
            # - name: XPU_HOOK_LIBRARY
            #   value: "libxhook.so.1"
          resources:
            requests:
              cpu: "50m"
          volumeMounts:
            - name: scheduler-config
              mountPath: /scheduler


            #- name: "xpushare-scheduler"
            #  mountPath: "/xpushare/scheduler"  
            - name: "xpushare-topology-volume"
              mountPath: "/xpushare-topology"


            - name: "xpushare-log"
              mountPath: "/xpushare/log"
      volumes:
        - name: scheduler-config
          configMap:
            name: scheduler-config


        #- name: "xpushare-scheduler"
          #hostPath:
            #path: "/xpushare/scheduler"
        - name: "xpushare-topology-volume"
          configMap:
            name: xpushare-topology-config


        - name: "xpushare-log"
          hostPath:
            path: "/xpushare/log"
            type: DirectoryOrCreate
      priorityClassName: system-node-critical
      tolerations:
      - key: "CriticalAddonsOnly"
        operator: "Exists"
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: "node-role.kubernetes.io/master"
                operator: "Exists"
            - matchExpressions:
              - key: "node-role.kubernetes.io/control-plane"
                operator: "Exists"
  
