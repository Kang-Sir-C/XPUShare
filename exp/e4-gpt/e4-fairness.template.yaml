apiVersion: v1
kind: Pod
metadata:
  name: xpushare-e4-a
  labels:
    "sharedgpu/gpu_request": "0.2"
    "sharedgpu/gpu_limit": "0.2"
spec:
  runtimeClassName: ix
  restartPolicy: Never
  schedulerName: xpushare-scheduler
  containers:
    - name: workload
      image: corex:4.3.6
      imagePullPolicy: IfNotPresent
      command: ["sh", "-lc", "python3 /work/e4_microbench_torch.py --seconds 60 --size 2048 --dtype fp16"]
      env:
        - name: XPUSHARE_POD_GPU_INDEX_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_index']
        - name: XPUSHARE_POD_GPU_UUID_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_uuid']
        - name: XPUSHARE_POD_GPU_MEM_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_mem']
      volumeMounts:
        - name: e4-script
          mountPath: /work
          readOnly: true
  volumes:
    - name: e4-script
      configMap:
        name: xpushare-e4-script
---
apiVersion: v1
kind: Pod
metadata:
  name: xpushare-e4-b
  labels:
    "sharedgpu/gpu_request": "0.4"
    "sharedgpu/gpu_limit": "0.4"
spec:
  runtimeClassName: ix
  restartPolicy: Never
  schedulerName: xpushare-scheduler
  containers:
    - name: workload
      image: corex:4.3.6
      imagePullPolicy: IfNotPresent
      command: ["sh", "-lc", "python3 /work/e4_microbench_torch.py --seconds 60 --size 2048 --dtype fp16"]
      env:
        - name: XPUSHARE_POD_GPU_INDEX_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_index']
        - name: XPUSHARE_POD_GPU_UUID_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_uuid']
        - name: XPUSHARE_POD_GPU_MEM_ANN
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['sharedgpu/gpu_mem']
      volumeMounts:
        - name: e4-script
          mountPath: /work
          readOnly: true
  volumes:
    - name: e4-script
      configMap:
        name: xpushare-e4-script
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: xpushare-e4-script
data:
  e4_microbench_torch.py: |
    #!/usr/bin/env python3
    # -*- coding: utf-8 -*-
    import argparse
    import os
    import time
    import traceback
    def main() -> int:
        ap = argparse.ArgumentParser()
        ap.add_argument("--seconds", type=int, default=60)
        ap.add_argument("--size", type=int, default=2048)
        ap.add_argument("--dtype", type=str, default="fp16", choices=["fp16", "fp32"])
        ap.add_argument("--warmup", type=int, default=3)
        # A periodic synchronize makes (i) the throughput metric reflect executed work
        # (not just queued kernels) and (ii) the enforcement time-slice phase less
        # sensitive to host-side sampling alignment.
        ap.add_argument("--report-every", type=float, default=1.0)
        args = ap.parse_args()
        try:
            import torch  # type: ignore
        except Exception as e:
            print(f"[E4][ERROR] torch import failed: {e}")
            return 2
        print(
            "[E4] env "
            f"POD_NAME={os.environ.get('POD_NAME')} "
            f"XPUSHARE_ENFORCEMENT_LAYER={os.environ.get('XPUSHARE_ENFORCEMENT_LAYER')} "
            f"LD_PRELOAD={os.environ.get('LD_PRELOAD')} "
            f"IX_VISIBLE_DEVICES={os.environ.get('IX_VISIBLE_DEVICES')} "
            f"CUDA_VISIBLE_DEVICES={os.environ.get('CUDA_VISIBLE_DEVICES')} "
            f"ann.gpu_index={os.environ.get('XPUSHARE_POD_GPU_INDEX_ANN','')} "
            f"ann.gpu_uuid={os.environ.get('XPUSHARE_POD_GPU_UUID_ANN','')} "
            f"ann.gpu_mem={os.environ.get('XPUSHARE_POD_GPU_MEM_ANN','')}"
        )
        try:
            if not torch.cuda.is_available():
                print("[E4][ERROR] torch.cuda.is_available() == False")
                return 3
            dev = torch.device("cuda:0")
            torch.cuda.set_device(dev)
            dtype = torch.float16 if args.dtype == "fp16" else torch.float32
            n = int(args.size)
            a = torch.randn((n, n), device=dev, dtype=dtype)
            b = torch.randn((n, n), device=dev, dtype=dtype)
            out = torch.empty((n, n), device=dev, dtype=dtype)
            t0 = time.perf_counter()
            warm_end = t0 + float(args.warmup)
            warm_iters = 0
            while time.perf_counter() < warm_end:
                torch.mm(a, b, out=out)
                warm_iters += 1
            torch.cuda.synchronize()
            print(f"[E4] warmup_done iters={warm_iters} seconds={time.perf_counter()-t0:.3f}")
            start = time.perf_counter()
            end = start + float(args.seconds)
            iters = 0
            last_report = start
            report_every = max(float(args.report_every), 0.0)
            while time.perf_counter() < end:
                torch.mm(a, b, out=out)
                iters += 1
                if report_every > 0.0:
                    now = time.perf_counter()
                    if now - last_report >= report_every:
                        torch.cuda.synchronize()
                        elapsed = now - start
                        ips = iters / elapsed if elapsed > 0 else 0.0
                        print(f"[E4] progress elapsed_sec={elapsed:.1f} iters={iters} iter_per_sec={ips:.3f}")
                        last_report = now
            torch.cuda.synchronize()
            duration = time.perf_counter() - start
            ips = iters / duration if duration > 0 else 0.0
            print(f"[E4] result seconds={duration:.3f} iters={iters} iter_per_sec={ips:.6f}")
            return 0
        except Exception as e:
            print(f"[E4][ERROR] exception: {e}")
            print(traceback.format_exc())
            return 1
    if __name__ == "__main__":
        raise SystemExit(main())
