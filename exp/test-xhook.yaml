apiVersion: v1
kind: Pod
metadata:
  name: xhook-test-gpu
  labels:
    # 这里的 Label 很重要，如果您的调度器配置了 Label Selector，需要匹配
    app: xhook-test
spec:
  restartPolicy: Never
  nodeName: localhost.localdomain  # 如果是单机测试，强制指派到当前节点
  
  containers:
  - name: test-container
    # 使用天数官方镜像，确保有 Python 和 CUDA 环境
    image: corex:with-greatwall
    
    command: ["/bin/bash", "-c"]
    args:
    - |
      echo "=== 1. 环境检查 ==="
      ls -l /xpushare/library/libxhook.so.1
      echo "POD_MANAGER_IP: $POD_MANAGER_IP"
      echo "XHOOK_GPU_MEM_SIZE: $XHOOK_GPU_MEM_SIZE"
      
      echo -e "\n=== 2. 启动长时间休眠，等待您进入容器测试 ==="
      sleep 360000
      
    env:
    # ---------------------------------------------------------
    # [核心配置] xhook Hook 必须的变量
    # ---------------------------------------------------------
    # 1. 注入 Hook 库 (这是显存隔离的灵魂)
    - name: LD_PRELOAD
      value: "/xpushare/library/libxhook.so.1"
      
    # 2. 限制显存为 4GB (4294967296 字节)
    #    如果是物理卡是 32GB，我们这里设 4GB，程序应该只能看到 4GB
    - name: XHOOK_GPU_MEM_SIZE
      value: "4294967296"
      
    # 3. 告诉 Hook 调度器(Pod Manager)在哪里
    #    因为 Scheduler 是 DaemonSet hostNetwork，所以 IP 就是宿主机 IP
    - name: POD_MANAGER_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
          
    # 4. Pod 信息，用于向调度器注册
    - name: POD_NAME
      valueFrom:
        fieldRef:
          fieldPath: metadata.name
    - name: POD_NAMESPACE
      valueFrom:
        fieldRef:
          fieldPath: metadata.namespace
          
    # 5. 基础可见性 (让底层驱动看到卡，然后 xhook 再进行拦截)
    - name: IX_VISIBLE_DEVICES
      value: "0"
      
    # ---------------------------------------------------------
    # [挂载配置]
    # ---------------------------------------------------------
    volumeMounts:
    # 挂载 Hook 库所在的目录
    - name: xpushare-library
      mountPath: /xpushare/library
      readOnly: true
    # 挂载 Socket 通信目录 (可选，视 xhook 版本而定)
    - name: xpushare-scheduler
      mountPath: /xpushare/scheduler
      
  volumes:
  # 对应宿主机上 Hook Init 容器复制出来的路径
  - name: xpushare-library
    hostPath:
      path: /xpushare/library
  - name: xpushare-scheduler
    hostPath:
      path: /xpushare/scheduler
