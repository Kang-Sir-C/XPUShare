apiVersion: v1
kind: Pod
metadata:
  name: mnist
  labels:
    "sharedgpu/gpu_request": "0.2"

    "sharedgpu/gpu_limit": "0.4"

    "sharedgpu/gpu_model": "Iluvatar-BI-V150"

    "sharedgpu/gpu_mem": "2147483648" 
    
spec:
  schedulerName: xpushare-scheduler

  restartPolicy: Never
  containers:
    - name: pytorch
      image:  corex:4.3.6
      command: ["sh", "-c", "sleep infinity"]
      imagePullPolicy: Never #IfNotPresent

      env:
      - name: CU_HOOK_DEBUG
        value: "1"